name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Lint
        run: mise run lint

      - name: Typecheck
        run: mise run typecheck

      - name: Test
        run: mise run test

  scan-fs:
    runs-on: ubuntu-24.04
    name: Scan dependencies and secrets
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Trivy action forces ALL severities into SARIF output regardless of the
      # severity filter, so reporting and gating are separate invocations:
      # report every finding to the Security tab, then gate on HIGH/CRITICAL.
      - name: Trivy filesystem scan (report all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          cache: "false" # actions/cache stalls under act and failed in CI; DB is cheap to fetch
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"

      - name: Upload filesystem scan to Security tab
        # env.ACT is set by nektos/act for local runs; the code-scanning API
        # upload needs a real GITHUB_TOKEN, so skip it there.
        if: ${{ always() && !env.ACT }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Trivy filesystem scan (gate HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          cache: "false"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          skip-setup-trivy: true

  scan-config:
    runs-on: ubuntu-24.04
    name: Scan Dockerfile and k8s manifests
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Trivy misconfiguration scan (report all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          cache: "false"
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"

      - name: Upload config scan to Security tab
        if: ${{ always() && !env.ACT }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Trivy misconfiguration scan (gate HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          cache: "false"
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          skip-setup-trivy: true

  image:
    runs-on: ubuntu-24.04
    name: Build and scan container image
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to cgr.dev (Chainguard)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: cgr.dev
          username: ${{ secrets.CGDEV_USERNAME }}
          password: ${{ secrets.CGDEV_PASSWORD }}

      - name: Build amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: pelocore:ci

      - name: Trivy image scan (gate HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: pelocore:ci
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
