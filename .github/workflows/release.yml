name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and scan but do not push, sign, or release"
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up toolchain (mise)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Lint
        run: mise run lint

      - name: Typecheck
        run: mise run typecheck

      - name: Test
        run: mise run test

      # Releases ship only from cryptographically verified tags: import the
      # GPG keys registered to the repo owner's GitHub account and check the
      # pushed tag against them. Unsigned tags or unknown keys fail the run.
      - name: Verify tag signature
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # checkout with fetch-depth 1 leaves the tag ref pointing at the
          # target commit; fetch the real tag object before checking it.
          git fetch --no-tags --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          type="$(git cat-file -t "${TAG}")"
          if [ "${type}" != "tag" ]; then
            echo "::error::${TAG} is not an annotated signed tag (found a ${type}); recreate with git tag -s"
            exit 1
          fi
          echo "Verifying ${TAG} against GPG keys registered to ${GH_OWNER} on GitHub"
          curl -sfL "https://api.github.com/users/${GH_OWNER}/gpg_keys?per_page=100" \
            | jq -r '.[].raw_key' \
            | gpg --import
          git verify-tag "${TAG}"

  build:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest_amd64: ${{ steps.push.outputs.digest_amd64 }}
      digest_arm64: ${{ steps.push.outputs.digest_arm64 }}
      version: ${{ steps.meta.outputs.version }}
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to cgr.dev (Chainguard)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: cgr.dev
          username: ${{ secrets.CGDEV_USERNAME }}
          password: ${{ secrets.CGDEV_PASSWORD }}

      # Build amd64 first, scan it, and only then push both architectures.
      - name: Build amd64 for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: pelocore:scan

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: pelocore:scan
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=pelocore
            org.opencontainers.image.description=Bridge that syncs Peloton workouts to COROS as FIT files
            org.opencontainers.image.licenses=Apache-2.0

      # amd64: build and push by digest. Only the bare image name may be
      # passed: buildx refuses tagged refs with push-by-digest. The versioned
      # tags are attached later by the imagetools manifest list.
      - name: Push amd64 by digest
        id: push_amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ !inputs.dry_run }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true

      # arm64: build and push by digest.
      - name: Push arm64 by digest
        id: push_arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: ${{ !inputs.dry_run }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true

      - name: Record digests
        id: push
        run: |
          echo "digest_amd64=${{ steps.push_amd64.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "digest_arm64=${{ steps.push_arm64.outputs.digest }}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # A manifest list is required so a tag points at both architectures.
      - name: Create manifest list and push
        if: ${{ inputs.dry_run != true }}
        working-directory: /tmp
        run: |
          IMAGE="${{ env.REGISTRY_IMAGE }}"
          for tag in ${{ steps.meta.outputs.tags }}; do
            docker buildx imagetools create \
              -t "$tag" \
              "${IMAGE}@${{ steps.push_amd64.outputs.digest }}" \
              "${IMAGE}@${{ steps.push_arm64.outputs.digest }}"
          done

  sign:
    needs: build
    if: ${{ needs.build.outputs.pushed == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # required for keyless OIDC signing
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sign by digest (tags are mutable); keyless uses the workflow's OIDC
      # identity as the certificate issuer.
      - name: Sign images (keyless)
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}
          DIGEST_AMD64: ${{ needs.build.outputs.digest_amd64 }}
          DIGEST_ARM64: ${{ needs.build.outputs.digest_arm64 }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST_AMD64}"
          cosign sign --yes "${IMAGE}@${DIGEST_ARM64}"

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY_IMAGE }}@${{ needs.build.outputs.digest_amd64 }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Attest SBOM (keyless)
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}
          DIGEST_AMD64: ${{ needs.build.outputs.digest_amd64 }}
        run: |
          cosign attest --yes --predicate sbom.cdx.json --type cyclonedx \
            "${IMAGE}@${DIGEST_AMD64}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: sha256:${{ needs.build.outputs.digest_amd64 }}
          push-to-registry: true

  release:
    needs: [build, sign]
    if: ${{ needs.build.outputs.pushed == 'true' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
