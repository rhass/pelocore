# pelocore in one-shot mode: run a single sync cycle and exit.
#   kubectl apply -f cronjob.yaml
#
# No volume needed: dedupe happens against the COROS import list, so state
# survives pod removal. Status visibility is logs + `pelocore status`.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pelocore-sync
  labels:
    app.kubernetes.io/name: pelocore
spec:
  # Every 15 minutes. Stateless mode polls Peloton + COROS each run
  # (an idle run costs ~3 light reads); this schedule is the API-traffic
  # knob - relax it (e.g. hourly) to be even lighter.
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pelocore
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pelocore
              image: ghcr.io/OWNER/PELOCORE:latest  # replace after first release
              imagePullPolicy: IfNotPresent
              args: ["sync"]
              envFrom:
                - secretRef:
                    name: pelocore
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
