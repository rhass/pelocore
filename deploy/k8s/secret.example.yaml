# Example secret for pelocore. Copy to secret.yaml, fill in, and apply:
#   kubectl apply -f secret.yaml
#
# Peloton: username/password login, or a refresh token instead of the password.
# COROS:   email/password login and/or a browser session token (the value of
#          the CPL-coros-token cookie on training.coros.com).
# PELOCORE_STATUS_TOKEN: optional; when set the status page and /sync require
#          "Authorization: Bearer <token>" (probes stay open).
apiVersion: v1
kind: Secret
metadata:
  name: pelocore
  labels:
    app.kubernetes.io/name: pelocore
type: Opaque
stringData:
  PELOTON_USERNAME: ""
  PELOTON_PASSWORD: ""
  # Optional alternative to password login:
  PELOTON_REFRESH_TOKEN: ""
  COROS_EMAIL: ""
  COROS_PASSWORD: ""
  # Optional: skip password login entirely with a browser session token
  # (region cookie CPL-coros-region maps 1=en, 2=cn, 3=eu):
  COROS_ACCESS_TOKEN: ""
  COROS_REGION: "en"
  # Optional hardening:
  PELOCORE_STATUS_TOKEN: ""
  # Optional overrides (quarter-hours east of UTC; 32 = UTC+8):
  # PELOCORE_TIMEZONE_QUARTERS: "0"
  # PELOCORE_BACKFILL_DAYS: "7"
  # PELOCORE_SYNC_INTERVAL_SECONDS: "900"
