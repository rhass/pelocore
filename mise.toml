min_version = "2024.9.5"

[tools]
python = "3.13"
uv = "latest"
ruff = "latest"
act = "latest"

[settings]
python.uv_venv_auto = "create|source"

[env]
UV_PROJECT_ENVIRONMENT = ".venv"

[tasks.install]
description = "Install dependencies"
alias = "i"
run = "uv sync --all-groups"

[tasks.start]
description = "Run the bridge (loop mode with status server)"
run = "op run -- uv run pelocore run"

[tasks.test]
description = "Run tests"
run = "uv run pytest"

[tasks.lint]
description = "Lint the code"
run = "uv run ruff check src tests"

[tasks.typecheck]
description = "Type-check the code"
run = "uv run mypy"

[tasks.docker-build]
description = "Build the container image"
run = "docker build -t pelocore:dev ."

[tasks.act-ci]
description = "Run CI workflow locally with act (requires Docker)"
# The runner image (~1.2 GB) is pulled once; pre-pulling makes progress
# visible instead of act appearing stuck on its first run. Scoped with -W:
# bare `act push` would also run release.yml. -W takes a path, not a name.
# op run resolves the CGDEV_* op:// references before act forwards them (-s
# NAME reads act's own env); requires the 1Password CLI from .mise.local.toml.
run = """
docker pull -q catthehacker/ubuntu:act-24.04
op run -- act push --workflows .github/workflows/ci.yml -s CGDEV_USERNAME -s CGDEV_PASSWORD
"""

[tasks.act-release-verify]
description = "Run release verify job locally with act (requires Docker)"
run = "act workflow_dispatch --workflows .github/workflows/release.yml --job verify --input dry_run=true"
